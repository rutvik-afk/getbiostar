name: Daily publish

# 4 posts/day at fixed IST times (postsPerDay: 4 in site.config.mjs), each
# with a backup run ~1h later — GitHub occasionally drops a scheduled
# trigger under load, and 05-publish-daily.mjs's own daily cap means an
# extra run on a day that already hit quota is a safe no-op, so the backup
# silently catches whatever the primary slot missed. Times below are UTC =
# IST minus 5:30.
on:
  schedule:
    - cron: '30 0 * * *'       # 00:30 UTC = 06:00 IST  (primary)
    - cron: '30 1 * * *'       # 01:30 UTC = 07:00 IST  (backup)
    - cron: '30 6 * * *'       # 06:30 UTC = 12:00 IST  (primary)
    - cron: '30 7 * * *'       # 07:30 UTC = 13:00 IST  (backup)
    - cron: '30 12 * * *'      # 12:30 UTC = 18:00 IST  (primary)
    - cron: '30 13 * * *'      # 13:30 UTC = 19:00 IST  (backup)
    - cron: '30 17 * * *'      # 17:30 UTC = 23:00 IST  (primary)
    - cron: '30 18 * * *'      # 18:30 UTC = 00:00 IST  (backup)
  workflow_dispatch:            # manual "Run workflow" button
    inputs:
      test_pin_slug:
        description: 'Optional: slug of an already-published post to force-pin right now (leave empty for normal behaviour)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: daily-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Weekly source refresh (Sunday, first run of the day only)
        if: ${{ github.event_name == 'schedule' }}
        run: |
          # "First run of the day" = the 00:xx UTC slot, checked by wall-clock
          # hour rather than exact cron string — safe against backup slots.
          if [ "$(date -u +%H)" = "00" ] && [ "$(date +%u)" = "7" ]; then
            CACHE_DAYS=7 node scripts/02-fetch-facts.mjs
            node scripts/02b-enrich-works.mjs || true
          else
            echo "not Sunday 00:xx UTC — skipping source refresh"
          fi

      - name: Regenerate posts (queue + refresh live pages)
        run: node scripts/03-generate-posts.mjs

      - name: Images
        run: node scripts/04-make-covers.mjs

      - name: Publish this run's post (1 of 4 today)
        run: node scripts/05-publish-daily.mjs --count 1

      - name: Build
        run: npm run build

      - name: Commit published content
        run: |
          git config user.name  "biostar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add content data public/img
          git diff --staged --quiet || git commit -m "content: publish $(date -u +%F' '%H:%M) UTC"
          git push

      - name: Pin today's new post to Pinterest
        env:
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
        run: |
          if [ -n "${{ inputs.test_pin_slug }}" ]; then
            node scripts/09-pin-to-pinterest.mjs --slug "${{ inputs.test_pin_slug }}"
          else
            node scripts/09-pin-to-pinterest.mjs
          fi
        continue-on-error: true  # a Pinterest hiccup should never fail the whole daily run

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 5
